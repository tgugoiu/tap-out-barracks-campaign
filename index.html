<!doctype html>
<html lang="{{lang}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>{{fullTitle}}</title>
    <meta name="description" content="{{description}}" />
    <meta name="theme-color" content="{{themeColor}}" />
    <meta name="color-scheme" content="dark" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    {{headExtra}}
  </head>
  <body>
    <div id="app" class="app is-loading chrome-hidden">
      <div class="room" aria-hidden="true"></div>

      <header class="masthead chrome" aria-hidden="true">
        <span class="masthead__title">{{title}}</span>
        <span class="masthead__sub">{{subtitle}}</span>
      </header>

      <main class="stage" id="stage" aria-label="{{fullTitle}}" aria-roledescription="magazine">
        <div class="shift" id="shift">
          <div class="lift" id="lift">
            <div class="stack stack--left" aria-hidden="true"></div>
            <div class="stack stack--right" aria-hidden="true"></div>
            <div class="book-shadow" aria-hidden="true"></div>
            <div class="book" id="book"></div>
          </div>
        </div>
      </main>

      <button class="edge edge--prev chrome" type="button" data-action="prev" aria-label="Previous page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4.5 7.5 12l7.5 7.5" /></svg>
      </button>
      <button class="edge edge--next chrome" type="button" data-action="next" aria-label="Next page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 4.5 7.5 7.5L9 19.5" /></svg>
      </button>

      <nav class="dock chrome" aria-label="Reader controls">
        <button class="btn btn--step" type="button" data-action="prev" aria-label="Previous page" data-tip="Previous  &#8592;">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6 8.5 12l6 6" /></svg>
        </button>
        <output class="folio" id="folio" aria-live="polite">&nbsp;</output>
        <button class="btn btn--step" type="button" data-action="next" aria-label="Next page" data-tip="Next  &#8594;">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 6 6 6-6 6" /></svg>
        </button>
        <span class="dock__sep" aria-hidden="true"></span>
        <button class="btn" type="button" data-action="overview" aria-label="All pages" aria-haspopup="dialog" data-tip="All pages  T">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4.5" width="6.5" height="6.5" rx=".6" /><rect x="13.5" y="4.5" width="6.5" height="6.5" rx=".6" /><rect x="4" y="13.5" width="6.5" height="6.5" rx=".6" /><rect x="13.5" y="13.5" width="6.5" height="6.5" rx=".6" /></svg>
        </button>
        <button class="btn" type="button" data-action="view" id="view-toggle" aria-label="Show single pages" data-tip="Single page">
          <svg class="icon-single" viewBox="0 0 24 24" aria-hidden="true"><rect x="7.5" y="4" width="9" height="16" rx=".6" /></svg>
          <svg class="icon-double" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.2c-2.2-1.3-5-1.7-8-1.2v14c3-.5 5.8-.1 8 1.2 2.2-1.3 5-1.7 8-1.2V5c-3-.5-5.8-.1-8 1.2Z" /><path d="M12 6.2v14" /></svg>
        </button>
        <button class="btn" type="button" data-action="zoom" aria-label="Inspect page detail" aria-haspopup="dialog" data-tip="Detail  Z">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="5.8" /><path d="m15 15 5 5M8 10.5h5M10.5 8v5" /></svg>
        </button>
        <button class="btn" type="button" data-action="share" aria-label="Copy a link to this page" data-tip="Link to this page">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4.2 4.2 0 0 0 6 0l3-3a4.2 4.2 0 0 0-6-6l-1 1" /><path d="M14 10a4.2 4.2 0 0 0-6 0l-3 3a4.2 4.2 0 0 0 6 6l1-1" /></svg>
        </button>
        <a class="btn" id="download" data-action="download" href="#" hidden aria-label="Download the PDF" data-tip="Download PDF">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19.5h14" /></svg>
        </a>
        <button class="btn" type="button" data-action="fullscreen" id="fullscreen" aria-label="Enter full screen" data-tip="Full screen  F">
          <svg class="icon-enter" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 9V4.5H9M15 4.5h4.5V9M19.5 15v4.5H15M9 19.5H4.5V15" /></svg>
          <svg class="icon-exit" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4.5V9H4.5M19.5 9H15V4.5M15 19.5V15h4.5M4.5 15H9v4.5" /></svg>
        </button>
      </nav>

      <div class="scrub chrome" id="scrub">
        <input class="scrub__range" id="scrub-range" type="range" min="0" max="1" step="1" value="0" aria-label="Go to spread" />
        <div class="scrub__preview" id="scrub-preview" aria-hidden="true">
          <div class="scrub__thumbs"></div>
          <span class="scrub__label"></span>
        </div>
      </div>

      <div class="overlay overview" id="overview" role="dialog" aria-modal="true" aria-label="All pages" hidden>
        <div class="overlay__bar">
          <span class="overlay__title">{{title}} <em>{{subtitle}}</em></span>
          <button class="btn" type="button" data-close aria-label="Close (Esc)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
          </button>
        </div>
        <div class="overview__grid" id="overview-grid" role="list"></div>
      </div>

      <div class="overlay zoom" id="zoom" role="dialog" aria-modal="true" aria-label="Page detail" hidden>
        <div class="zoom__viewport" id="zoom-viewport"><div class="zoom__canvas" id="zoom-canvas"></div></div>
        <div class="zoom__tools">
          <button class="btn" type="button" data-zoom="out" aria-label="Zoom out (−)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12" /></svg>
          </button>
          <output class="zoom__level" id="zoom-level">100%</output>
          <button class="btn" type="button" data-zoom="in" aria-label="Zoom in (+)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12M12 6v12" /></svg>
          </button>
          <span class="dock__sep" aria-hidden="true"></span>
          <button class="btn" type="button" data-close aria-label="Close detail view (Esc)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
          </button>
        </div>
      </div>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>
      <div class="loading" aria-hidden="true"><span class="loading__bar"></span></div>
      <noscript>
        <div class="notice">
          <p>This magazine needs JavaScript to turn its pages.</p>
          {{noscriptLink}}
        </div>
      </noscript>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
